version: "3.8"

services:
  # --------------------------------------------------------------------------
  # Database Service: Authoritative PostgreSQL 15 Engine
  # --------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: smart-water-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smart_water_advisor_db}
    volumes:
      # Persistent named volume preserves committed data across restarts
      - pgdata:/var/lib/postgresql/data
      # Authoritative 12-table schema executed on fresh volumes only
      - ../4_DEVELOPMENT/backend/database/init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smart_water_advisor_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - water_net

  # --------------------------------------------------------------------------
  # Web Service: Flask REST API + Gunicorn WSGI Server + Frontend Static Host
  # --------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: 8_DEPLOYMENT/Dockerfile
    container_name: smart-water-web
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      PORT: 5000
      SECRET_KEY: ${SECRET_KEY:-c9371e7d2b86a01490218f2f4510078b54902a7b1b36998c7604a55225114a80}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-f78a2e1d0c9b8a7f6e5d4c3b2a10987654321fedcba0987654321abcdef01234}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-smart_water_advisor_db}
      DATABASE_ENGINE: postgresql
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      ENABLE_DEMO_TOKEN: "false"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    ports:
      - "${WEB_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - water_net

# ----------------------------------------------------------------------------
# Isolated Internal Bridge Network
# ----------------------------------------------------------------------------
networks:
  water_net:
    driver: bridge

# ----------------------------------------------------------------------------
# Persistent PostgreSQL Named Volume Storage
# ----------------------------------------------------------------------------
volumes:
  pgdata:
    driver: local
